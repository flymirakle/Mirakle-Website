<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mirakle</title>
  <link rel="icon" type="image/png" href="logowhite.png">

  <!--
    Loader page. Shows the version that matches the screen width inside a
    full-screen frame, so the address bar never changes:
      computer.html  wider than 1024px
      tablet.html    761px to 1024px
      phone.html     760px and below
  -->
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }

    #site {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>

  <iframe id="site" title="Mirakle"></iframe>

  <noscript>
    <p>
      Choose a version:
      <a href="computer.html">Computer</a> ·
      <a href="tablet.html">Tablet</a> ·
      <a href="phone.html">Phone</a>
    </p>
  </noscript>

  <script>
    const frame = document.getElementById("site");
    const phoneQuery = window.matchMedia("(max-width: 760px)");
    const tabletQuery = window.matchMedia("(max-width: 1024px)");

    function pickPage() {
      if (phoneQuery.matches) return "phone.html";
      if (tabletQuery.matches) return "tablet.html";
      return "computer.html";
    }

    function loadPage() {
      const page = pickPage();
      if (frame.dataset.page !== page) {
        frame.dataset.page = page;
        frame.src = page;
      }
    }

    loadPage();
    phoneQuery.addEventListener("change", loadPage);
    tabletQuery.addEventListener("change", loadPage);
  </script>

</body>
</html>
