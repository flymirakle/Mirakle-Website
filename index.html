<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mirakle</title>
  <link rel="icon" type="image/png" href="logowhite.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --blue: rgb(43, 156, 246);
      --blue-hover: rgb(43, 156, 246);
      --nav-height: clamp(56px, 8.3vh, 90px);
      --nav-padding: 3vw;
      --menu-speed: 0.35s;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      color: #ffffff;
      font-family: "Trebuchet MS", sans-serif;
    }

    body.menu-open {
      overflow: hidden;
    }

    /* ---------- Top selection bar ---------- */

    .navbar {
      position: sticky;
      top: 0;
      z-index: 30;
      height: var(--nav-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--nav-padding);
      background-color: #ffffff;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 1vw;
      color: var(--blue);
      text-decoration: none;
    }

    /* Filter recolors the white PNG to roughly match --blue */
    .brand-logo {
      width: clamp(40px, 4vw, 64px);
      height: auto;
      display: block;
      filter: brightness(0) saturate(100%) invert(33%) sepia(98%) saturate(3000%) hue-rotate(211deg) brightness(101%) contrast(101%);
    }

    .brand-name {
      font-family: "Lexend", sans-serif;
      font-size: clamp(18px, 1.7vw, 28px);
      font-weight: bold;
      letter-spacing: clamp(4px, 0.6vw, 10px);
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 2.2vw;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .nav-links a {
      font-family: "Lexend", sans-serif;
      color: rgb(0, 0, 0);
      font-size: clamp(12px, 0.95vw, 16px);
      font-weight: 550;
      letter-spacing: 0.5px;
      text-decoration: none;
      white-space: nowrap;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--blue);
    }

    .menu-toggle {
      display: none;
      position: relative;
      z-index: 31;
      background: none;
      border: none;
      padding: 8px;
      cursor: pointer;
    }

    .menu-toggle span {
      display: block;
      width: 26px;
      height: 3px;
      margin: 5px 0;
      background-color: #000000;
      transition: transform var(--menu-speed) ease, opacity var(--menu-speed) ease;
    }

    .menu-backdrop {
      display: none;
    }

    /* ---------- Hero with background image ---------- */

    .hero {
      min-height: calc(100vh - var(--nav-height));
      display: flex;
      align-items: center;
      padding: 0 8vw;
      background-image: url("miraklebg-comp.jpg");
      background-size: 95vw 100vh;   /* fixed width and height */
      background-size: 96% auto;
      background-position: center top;
      background-repeat: no-repeat;
    }

    .hero-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 50vw;
    }

    .hero-title {
      margin: 0 0 1vh;
      font-size: clamp(2.4rem, 5vw, 4.5rem);
      font-weight: bold;
      line-height: 1.1;
      letter-spacing: 2px;
      text-align: center;
    }

    .explore-btn {
      background-color: var(--blue);
      color: #ffffff;
      border: none;
      font-family: inherit;
      font-size: clamp(14px, 1.1vw, 18px);
      font-weight: bold;
      letter-spacing: 2px;
      padding: 1.6vh 3vw;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .explore-btn:hover {
      background-color: var(--blue-hover);
      transform: translateY(-2px);
    }

    /* ---------- Computer ---------- */

    @media (min-width: 1025px) {
      .hero {
        align-items: center;
        justify-content: flex-start;
        padding: 0 8vw;
      }

      .hero-content {
        align-items: flex-start;
      }

      .hero-title {
        text-align: left;
      }
    }

    /* ---------- Tablet ---------- */

    @media (max-width: 1024px) {
      :root {
        --nav-padding: 3.5vw;
        --nav-height: 5vh;
      }

      .brand-name {
        font-size: 3vw;
        letter-spacing: 0.7vw;
      }

      .hero-title br {
        display: none;
        margin-bottom: 0;
      }

      .hero-title {
        font-size: 8vw;
      }

      .nav-links {
        gap: 2vw;
      }

      .nav-links a {
        font-size: 1.6vw;
        letter-spacing: 0.1vw;
      }

      .hero {
        background-size: 98vw 100vh;   /* fixed width and height */
        background-size: 98% auto;
        background-image: url("miraklebg-tab.jpg");
        align-items: flex-start;
        justify-content: center;
        padding: 4vh 0 0 0;
      }

      .hero-content {
        max-width: 60vw;
      }

      .explore-btn {
        padding: 1.5vh 4vw;
      }
    }

    /* ---------- Phone ---------- */

    @media (max-width: 760px) {
      :root {
        --nav-padding: 5vw;
      }

      .brand {
        gap: 3vw;
      }

      .brand-logo {
        width: 11vw;
        max-width: 48px;
      }

      .brand-name {
        font-size: 5vw;
        letter-spacing: 1.5vw;
      }

      .menu-toggle {
        display: block;
      }

      .menu-toggle[aria-expanded="true"] span:nth-child(1) {
        transform: translateY(8px) rotate(45deg);
      }

      .menu-toggle[aria-expanded="true"] span:nth-child(2) {
        opacity: 0;
      }

      .menu-toggle[aria-expanded="true"] span:nth-child(3) {
        transform: translateY(-8px) rotate(-45deg);
      }

      /* Slide-in panel: starts off-screen on the right, stops at the middle */
      .nav-links {
        position: fixed;
        top: var(--nav-height);
        right: 0;
        width: 50vw;
        height: calc(100vh - var(--nav-height));
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        padding-top: 2vh;
        background-color: #ffffff;
        box-shadow: -2vw 0 4vw rgba(0, 0, 0, 0.15);
        transform: translateX(100%);
        visibility: hidden;
        transition: transform var(--menu-speed) ease, visibility 0s linear var(--menu-speed);
        z-index: 25;
      }

      .nav-links.open {
        transform: translateX(0);
        visibility: visible;
        transition: transform var(--menu-speed) ease, visibility 0s;
      }

      .nav-links a {
        display: block;
        padding: 2.4vh 6vw;
        font-size: 4vw;
        letter-spacing: 0.3vw;
        border-bottom: 1px solid #eeeeee;
      }

      .menu-backdrop {
        display: block;
        position: fixed;
        inset: var(--nav-height) 0 0 0;
        background-color: rgba(0, 0, 0, 0.4);
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--menu-speed) ease;
        z-index: 20;
      }

      .menu-backdrop.open {
        opacity: 1;
        pointer-events: auto;
      }

      .hero {
        padding: 0 7vw;
        align-items: flex-end;
        padding-bottom: 72vh;
        background-image:
        linear-gradient(to top, rgb(70 70 70 / 0%), rgba(0, 0, 0, 0)), url("miraklebg-phone.jpg");
          background-size: 95vw 30vh;   /* fixed width and height */
          background-size: 95% auto;
        background-position: center, center top;
      }

      .hero-content {
        max-width: 86vw;
      }

      .hero-title {
        font-size: 11vw;
        margin-bottom: 3vh;
      }

      .explore-btn {
        font-size: 4vw;
        padding: 1.8vh 10vw;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a class="brand" href="index.html">
      <img class="brand-logo" src="logowhite.png" alt="Mirakle logo">
      <span class="brand-name">MIRAKLE</span>
    </a>

    <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav-links">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <ul class="nav-links" id="nav-links">
      <li><a href="#">MISSION</a></li>
      <li><a href="#">UPDATES</a></li>
      <li><a href="#">OUR VEHICLE</a></li>
      <li><a href="#">AUTOHOVER</a></li>
      <li><a href="#">CONTACT</a></li>
    </ul>
  </nav>

  <div class="menu-backdrop"></div>

  <main class="hero">
    <div class="hero-content">
      <h1 class="hero-title">Experience <br>the future</h1>
      <button class="explore-btn" type="button">Explore</button>
    </div>
  </main>

  <script>
    const menuToggle = document.querySelector(".menu-toggle");
    const navLinks = document.querySelector(".nav-links");
    const backdrop = document.querySelector(".menu-backdrop");
    const phoneQuery = window.matchMedia("(max-width: 760px)");

    function setMenu(open) {
      navLinks.classList.toggle("open", open);
      backdrop.classList.toggle("open", open);
      document.body.classList.toggle("menu-open", open);
      menuToggle.setAttribute("aria-expanded", open);
      menuToggle.setAttribute("aria-label", open ? "Close menu" : "Open menu");
    }

    menuToggle.addEventListener("click", () => {
      setMenu(!navLinks.classList.contains("open"));
    });

    backdrop.addEventListener("click", () => setMenu(false));

    navLinks.querySelectorAll("a").forEach((link) => {
      link.addEventListener("click", () => setMenu(false));
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") setMenu(false);
    });

    phoneQuery.addEventListener("change", (event) => {
      if (!event.matches) setMenu(false);
    });
  </script>

</body>
</html>
