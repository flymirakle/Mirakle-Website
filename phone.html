<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mirakle</title>
  <link rel="icon" type="image/png" href="logowhite.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">

  <!-- Phone version: screens 760px wide and below -->
  <style>
    :root {
      --blue: rgb(43, 156, 246);
      --blue-hover: rgb(43, 156, 246);
      --nav-height: 5vh;
      --nav-padding: 5vw;
      --menu-speed: 0.35s;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: "Trebuchet MS", sans-serif;
    }

    body.menu-open {
      overflow: hidden;
    }

    /* ---------- Top selection bar ---------- */

    /* Overlays the hero; absolute so it scrolls away with the page */
    .navbar {
      position: absolute;
      top: 2vh;
      left: 0;
      right: 0;
      z-index: 30;
      height: var(--nav-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--nav-padding);
      background-color: transparent;
    }

    .brand {
      display: flex;
      align-items: left;
      gap: 3vw;
      color: var(--blue);
      text-decoration: none;
      border-radius: 5vw;
      padding: 0vw 0vw;
    }

    /* Filter recolors the white PNG to roughly match --blue */
    .brand-logo {
      width: 11vw;
      max-width: 48px;
      height: auto;
      display: block;
      filter: brightness(0) saturate(100%) invert(33%) sepia(98%) saturate(3000%) hue-rotate(211deg) brightness(101%) contrast(101%);
    }

    .brand-name {
  width: 35vw;
  height: auto;
  display: block;
  flex-shrink: 0;
  
}

    /* ---------- Hamburger button ---------- */

    .menu-toggle {
      display: block;
      position: relative;
      z-index: 31;
      background: none;
      border: none;
      padding: 8px;
      cursor: pointer;
      background-color: rgba(77, 77, 77, 0.5);
      border-radius: 5vw;
      padding: 2vw 2vw;
    }

    .menu-toggle span {
      display: block;
      width: 5vw;
      height: 0.7vw;
      margin: 0.7vw 0;
      background-color: #ffffff;
      transition: transform var(--menu-speed) ease, opacity var(--menu-speed) ease;
    }

    .menu-toggle[aria-expanded="true"] span:nth-child(1) {
      transform: translateY(8px) rotate(45deg);
    }

    .menu-toggle[aria-expanded="true"] span:nth-child(2) {
      opacity: 0;
    }

    .menu-toggle[aria-expanded="true"] span:nth-child(3) {
      transform: translateY(-8px) rotate(-45deg);
    }

    /* ---------- Slide-in menu: starts off-screen on the right, stops at the middle ---------- */

    .nav-links {
      position: fixed;
      top: var(--nav-height);
      right: 0;
      width: 50vw;
      height: calc(100vh - var(--nav-height));
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      margin: 0;
      padding: 2vh 0 0 0;
      list-style: none;
      background-color: #ffffff;
      box-shadow: -2vw 0 4vw rgba(0, 0, 0, 0.15);
      transform: translateX(100%);
      visibility: hidden;
      transition: transform var(--menu-speed) ease, visibility 0s linear var(--menu-speed);
      z-index: 25;
    }

    .nav-links.open {
      transform: translateX(0);
      visibility: visible;
      transition: transform var(--menu-speed) ease, visibility 0s;
    }

    .nav-links a {
      display: block;
      padding: 2.4vh 6vw;
      font-family: "Lexend", sans-serif;
      color: rgb(0, 0, 0);
      font-size: 4vw;
      font-weight: 550;
      letter-spacing: 0.3vw;
      text-decoration: none;
      white-space: nowrap;
      border-bottom: 1px solid #eeeeee;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--blue);
    }

    .menu-backdrop {
      position: fixed;
      inset: var(--nav-height) 0 0 0;
      background-color: rgba(0, 0, 0, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--menu-speed) ease;
      z-index: 20;
    }

    .menu-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    /* ---------- Hero with background image ---------- */

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 8vh 7vw 0 7vw;
      background-color: #000000;
      background-image:
        linear-gradient(to top, rgb(70 70 70 / 0%), rgba(0, 0, 0, 0)),
        url("miraklebg-phone.jpg");
      background-size: cover, cover;
      background-position: center, center top;
      background-repeat: no-repeat;
    }

    .hero-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 86vw;
    }

    .hero-title {
      margin: 0 0 2vh;
      font-family: "Bungee", sans-serif;
      font-size: 18vw;
      font-weight: bold;
      line-height: 1.2;
      letter-spacing: 2px;
      text-align: left;
      text-shadow: 0.5vw 0.5vw 1.5vw rgba(0, 0, 0, 0.1);
    }

    

    .explore-btn {
      background-color: #ffffff;
      color: var(--blue);
      border: none;
      font-family: inherit;
      font-size: 3.5vw;
      font-weight: bold;
      font-family: "Lexend", sans-serif;
      letter-spacing: 2px;
      padding: 1.4vh 10vw;
      margin-top: 0vh;
      margin-right: 56vw;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.2s ease;
      text-shadow: 0.5vw 0.5vw 1.5vw rgba(0, 0, 0, 0);
      border-radius: 5vw;
    }

    .explore-btn:hover {
      background-color: var(--blue-hover);
      transform: translateY(-2px);
    }

    /* ---------- How it works: stacked ---------- */

    .systems {
      display: flex;
      flex-direction: column;
      margin: 0;
      background-color: #000000;
    }

    .system {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3vh;
      min-height: 80vh;
      padding: 8vh 8vw;
      text-align: center;
      background-color: #000000;
    }

    .system-image {
      width: 55vw;
      max-width: 280px;
      height: auto;
      display: block;
      filter: invert(1);
    }

    .system-title {
      margin: 0;
      font-family: "Lexend", sans-serif;
      font-size: 7vw;
      font-weight: 700;
      letter-spacing: 2px;
      color: #ffffff;
    }

    .system-text {
      margin: 0;
      max-width: 80vw;
      font-family: "Lexend", sans-serif;
      font-size: 3.8vw;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.75);
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a class="brand" href="index.html" target="_top">
      <img class="brand-name" src="logowhite2.png" alt="Mirakle">
    </a>

    <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav-links">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <ul class="nav-links" id="nav-links">
      <li><a href="#">MISSION</a></li>
      <li><a href="#">UPDATES</a></li>
      <li><a href="#">OUR VEHICLE</a></li>
      <li><a href="#">AUTOHOVER</a></li>
      <li><a href="#">CONTACT</a></li>
    </ul>
  </nav>

  <div class="menu-backdrop"></div>

  <main class="hero">
    <div class="hero-content">
      <h1 class="hero-title">TIME TO<br>WELCOME<br>THE<br>FUTURE</h1>
      <button class="explore-btn" type="button">Explore</button>
    </div>
  </main>

  <section class="systems" aria-label="How it works">
    <article class="system system-propeller">
      <img class="system-image" src="propeller.png" alt="Mirakle propeller">
      <h2 class="system-title">PROPELLER</h2>
      <p class="system-text">Multi-blade lift system that keeps Mirakle stable in hover and vertical takeoff.</p>
    </article>
    <article class="system system-engine">
      <img class="system-image" src="engine.png" alt="Mirakle engine">
      <h2 class="system-title">ENGINE</h2>
      <p class="system-text">High-output propulsion unit built for forward flight and sustained cruise power.</p>
    </article>
  </section>

  <script>
    const menuToggle = document.querySelector(".menu-toggle");
    const navLinks = document.querySelector(".nav-links");
    const backdrop = document.querySelector(".menu-backdrop");

    function setMenu(open) {
      navLinks.classList.toggle("open", open);
      backdrop.classList.toggle("open", open);
      document.body.classList.toggle("menu-open", open);
      menuToggle.setAttribute("aria-expanded", open);
      menuToggle.setAttribute("aria-label", open ? "Close menu" : "Open menu");
    }

    menuToggle.addEventListener("click", () => {
      setMenu(!navLinks.classList.contains("open"));
    });

    backdrop.addEventListener("click", () => setMenu(false));

    navLinks.querySelectorAll("a").forEach((link) => {
      link.addEventListener("click", () => setMenu(false));
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") setMenu(false);
    });
  </script>

</body>
</html>
