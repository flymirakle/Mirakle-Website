<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mirakle</title>
  <link rel="icon" type="image/png" href="logowhite.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Computer version: screens wider than 1024px -->
  <style>
    :root {
      --blue: rgb(43, 156, 246);
      --blue-hover: rgb(43, 156, 246);
      --nav-height: clamp(56px, 8.3vh, 90px);
      --nav-padding: 3vw;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: "Trebuchet MS", sans-serif;
    }

    /* ---------- Top selection bar ---------- */

    /* Overlays the hero; absolute so it scrolls away with the page */
    .navbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      height: var(--nav-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--nav-padding);
      background-color: transparent;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 1vw;
      color: var(--blue);
      text-decoration: none;
    }

    /* Filter recolors the white PNG to roughly match --blue */
    .brand-logo {
      width: clamp(40px, 4vw, 64px);
      height: auto;
      display: block;
      filter: brightness(0) saturate(100%) invert(33%) sepia(98%) saturate(3000%) hue-rotate(211deg) brightness(101%) contrast(101%);
    }

    .brand-name {
      margin-top: 2vh;
  width: 14vw;
  height: auto;
  display: block;
  flex-shrink: 0;
}

    .nav-links {
      display: flex;
      align-items: center;
      gap: 2.2vw;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .nav-links a {
      font-family: "Lexend", sans-serif;
      color: rgb(255, 255, 255);
      font-size: clamp(12px, 0.95vw, 16px);
      font-weight: 550;
      letter-spacing: 0.5px;
      text-decoration: none;
      white-space: nowrap;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--blue);
    }

    /* ---------- Hero with background image ---------- */

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: var(--nav-height) 8vw 0 8vw;
      background-color: #000000;
      background-image: url("miraklebg-comp.jpg");
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
    }

    .hero-content {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      max-width: 50vw;
    }

    .hero-title {
      margin: 0 0 1vh;
      font-size: clamp(2.4rem, 5vw, 4.5rem);
      font-weight: bold;
      line-height: 1.1;
      letter-spacing: 2px;
      text-align: left;
      font-family: "Lexend", sans-serif;
    }

    .explore-btn {
      background-color: var(--blue);
      color: #ffffff;
      border: none;
      font-family: inherit;
      font-size: clamp(14px, 1.1vw, 18px);
      font-weight: bold;
      font-family: "Lexend", sans-serif;
      letter-spacing: 2px;
      padding: 1.6vh 3vw;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .explore-btn:hover {
      background-color: var(--blue-hover);
      transform: translateY(-2px);
    }

    /* ---------- How it works: side by side ---------- */

    .systems {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      min-height: 85vh;
      margin: 0;
      background-color: #000000;
    }

    .system {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5vh;
      padding: 8vh 5vw;
      text-align: center;
      background-color: #000000;
    }

    .system-image {
      width: min(28vw, 320px);
      height: auto;
      display: block;
      filter: invert(1);
    }

    .system-title {
      margin: 0;
      font-family: "Lexend", sans-serif;
      font-size: clamp(1.4rem, 2vw, 2.2rem);
      font-weight: 700;
      letter-spacing: 2px;
      color: #ffffff;
    }

    .system-text {
      margin: 0;
      max-width: 28vw;
      font-family: "Lexend", sans-serif;
      font-size: clamp(0.9rem, 1vw, 1.1rem);
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.75);
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a class="brand" href="index.html" target="_top">
     
      <img class="brand-name" src="logowhite2.png" alt="Mirakle">
    </a>

    <ul class="nav-links">
      <li><a href="#">MISSION</a></li>
      <li><a href="#">UPDATES</a></li>
      <li><a href="#">OUR VEHICLE</a></li>
      <li><a href="#">AUTOHOVER</a></li>
      <li><a href="#">CONTACT</a></li>
    </ul>
  </nav>

  <main class="hero">
    <div class="hero-content">
      <h1 class="hero-title">Welcoming<br>the future</h1>
      <button class="explore-btn" type="button">Explore</button>
    </div>
  </main>

  <section class="systems" aria-label="How it works">
    <article class="system system-propeller">
      <img class="system-image" src="propeller.png" alt="Mirakle propeller">
      <h2 class="system-title">PROPELLER</h2>
      <p class="system-text">Multi-blade lift system that keeps Mirakle stable in hover and vertical takeoff.</p>
    </article>
    <article class="system system-engine">
      <img class="system-image" src="engine.png" alt="Mirakle engine">
      <h2 class="system-title">ENGINE</h2>
      <p class="system-text">High-output propulsion unit built for forward flight and sustained cruise power.</p>
    </article>
  </section>

</body>
</html>
